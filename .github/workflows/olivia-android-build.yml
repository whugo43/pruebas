name: Olivia Magical Claw - APK
on:
  push:
    branches:
      - olivia-apk-build
  pull_request:
    branches:
      - master
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build signed debug APK
        working-directory: olivia
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Validate APK contents and signature
        run: |
          test -s olivia/app/build/outputs/apk/debug/app-debug.apk
          unzip -t olivia/app/build/outputs/apk/debug/app-debug.apk | tail -1
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging olivia/app/build/outputs/apk/debug/app-debug.apk | head -5
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose olivia/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Olivia-Magica-APK
          path: olivia/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
